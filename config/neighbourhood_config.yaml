# =============================================================================
# GridFlex Local - Phase 1 Configuration
# =============================================================================
# Every parameter is tagged with its data category:
#   [data-derived]          - sourced from a public/authoritative dataset
#   [synthetic]             - generated by simulation; not measured data
#   [engineering-assumption]- selected for the prototype; not claimed as
#                             an Indian grid standard unless noted
# =============================================================================

simulation:
  start_date: "2026-01-15"          # [engineering-assumption] nominal winter weekday
  duration_days: 1                   # [engineering-assumption] 24-hour simulation
  timestep_minutes: 15               # [engineering-assumption] 15-minute resolution (96 timesteps/day)
  random_seed: 42                    # [engineering-assumption] fixed seed for reproducible randomness
  timezone: "Asia/Kolkata"           # [engineering-assumption] Indian Standard Time (IST)

# -----------------------------------------------------------------------------
# Neighbourhood composition
# -----------------------------------------------------------------------------
neighbourhood:
  households: 100                    # [engineering-assumption] prototype residential scale
  pv_penetration: 0.60              # [engineering-assumption] 60% of households have rooftop PV (~60 systems)
  commercial_consumers: 5           # [engineering-assumption] local shops / small offices
  critical_facilities: 1            # [engineering-assumption] primary health clinic / emergency facility
  ev_count: 20                      # [engineering-assumption] 20 EV charging loads
  flexible_load_count: 3            # [engineering-assumption] 3 configurable flexible demand blocks

# -----------------------------------------------------------------------------
# Solar PV parameters
# -----------------------------------------------------------------------------
solar:
  min_capacity_kw: 2.0              # [engineering-assumption] typical small residential rooftop PV
  max_capacity_kw: 6.0              # [engineering-assumption] typical medium/large residential rooftop PV
  mean_capacity_kw: 3.5             # [engineering-assumption] average residential system size
  std_capacity_kw: 1.0              # [engineering-assumption] capacity diversity
  peak_sun_hour: 12.5               # [engineering-assumption] 12:30 PM peak solar radiation
  sunrise_hour: 6.0                 # [engineering-assumption] 06:00 AM
  sunset_hour: 18.25                # [engineering-assumption] 06:15 PM
  power_factor: 1.0                 # [engineering-assumption] unity power factor for rooftop inverters

# -----------------------------------------------------------------------------
# Community Battery Energy Storage System (BESS)
# -----------------------------------------------------------------------------
battery:
  der_id: "BESS_COMMUNITY_01"       # [engineering-assumption]
  name: "Neighbourhood Community BESS"
  bus_id: "Bus_BESS"                # Connected to designated community storage bus
  energy_capacity_kwh: 100.0        # [engineering-assumption] 100 kWh community storage
  max_charge_kw: 25.0               # [engineering-assumption] 0.25 C rate
  max_discharge_kw: 25.0            # [engineering-assumption] 0.25 C rate
  initial_soc: 0.50                 # [engineering-assumption] 50% initial state of charge
  min_soc: 0.20                     # [engineering-assumption] 20% minimum depth of discharge limit
  max_soc: 0.90                     # [engineering-assumption] 90% maximum charge limit
  charge_efficiency: 0.95           # [engineering-assumption] round-trip efficiency ~90%
  discharge_efficiency: 0.95        # [engineering-assumption]
  power_factor: 1.0                 # [engineering-assumption] unity power factor baseline
  baseline_mode: "idle"             # [engineering-assumption] idle in Phase 1 (no autonomous dispatch)

# -----------------------------------------------------------------------------
# Residential Load parameters
# -----------------------------------------------------------------------------
residential_loads:
  base_daily_kwh_min: 4.0           # [synthetic] low-tier household (~120 kWh/month)
  base_daily_kwh_max: 18.0          # [synthetic] high-tier household (~540 kWh/month)
  base_daily_kwh_mean: 9.5          # [synthetic] average household (~285 kWh/month)
  power_factor: 0.95                # [engineering-assumption] lagging power factor

# -----------------------------------------------------------------------------
# Commercial Load parameters
# -----------------------------------------------------------------------------
commercial_loads:
  peak_kw_min: 8.0                  # [synthetic] small retail / corner shop
  peak_kw_max: 25.0                 # [synthetic] small supermarket / branch office
  power_factor: 0.92                # [engineering-assumption] lagging power factor

# -----------------------------------------------------------------------------
# Critical Facility parameters
# -----------------------------------------------------------------------------
critical_facility:
  facility_id: "CRIT_001"
  name: "Primary Health Centre"
  base_kw: 5.0                      # [synthetic] baseline continuous equipment & lighting load
  peak_kw: 12.0                     # [synthetic] peak clinical & diagnostic load
  priority: 1                       # [engineering-assumption] highest restoration/protection priority
  power_factor: 0.96                # [engineering-assumption]

# -----------------------------------------------------------------------------
# Electric Vehicle (EV) charging parameters
# -----------------------------------------------------------------------------
ev_charging:
  charger_rating_kw: 7.4            # [engineering-assumption] single-phase 32A Level 2 / AC home wallbox
  min_daily_energy_kwh: 8.0         # [synthetic] daily commuter demand (~50 km)
  max_daily_energy_kwh: 22.0        # [synthetic] heavier commute / mid-range battery recharge
  arrival_hour_mean: 19.0           # [engineering-assumption] 07:00 PM average evening arrival
  arrival_hour_std: 1.5             # [engineering-assumption]
  departure_hour_mean: 7.5          # [engineering-assumption] 07:30 AM departure
  departure_hour_std: 1.0           # [engineering-assumption]
  power_factor: 0.98                # [engineering-assumption] modern PFC inverter charger

# -----------------------------------------------------------------------------
# Flexible Loads (Baseline schedule, not optimized in Phase 1)
# -----------------------------------------------------------------------------
flexible_loads:
  - load_id: "FL001"
    name: "Community Water Pump"
    rated_kw: 3.5                   # [synthetic] community water supply pump
    start_hour: 5.5                 # 05:30 AM
    end_hour: 8.0                   # 08:00 AM
    bus_name: "Bus_Residential_1"
    flexible: true
  - load_id: "FL002"
    name: "Commercial HVAC Group"
    rated_kw: 10.0                  # [synthetic] commercial cooling
    start_hour: 9.0                 # 09:00 AM
    end_hour: 17.5                  # 05:30 PM
    bus_name: "Bus_Commercial"
    flexible: true
  - load_id: "FL003"
    name: "Deferrable Appliance Block"
    rated_kw: 4.0                   # [synthetic] dishwashers/laundry cluster
    start_hour: 11.0                # 11:00 AM
    end_hour: 14.5                  # 02:30 PM
    bus_name: "Bus_Residential_2"
    flexible: true

# -----------------------------------------------------------------------------
# Network topology & electrical parameters
# -----------------------------------------------------------------------------
network:
  feeder_name: "GridFlex_LV_Feeder_01"
  nominal_hv_kv: 11.0               # [engineering-assumption] standard MV distribution level
  nominal_lv_kv: 0.415              # [engineering-assumption] 415 V 3-phase line-to-line (240V phase-to-neutral)
  frequency_hz: 50.0                # [engineering-assumption] Indian grid nominal frequency
  transformer:
    name: "DT_11_0.415_250kVA"
    sn_mva: 0.250                   # [engineering-assumption] 250 kVA Distribution Transformer
    vn_hv_kv: 11.0
    vn_lv_kv: 0.415
    vk_percent: 4.0                 # [engineering-assumption] short-circuit voltage %
    vkr_percent: 1.1                # [engineering-assumption] real part of short-circuit voltage %
    pfe_kw: 0.60                    # [engineering-assumption] iron core losses
    i0_percent: 0.25                # [engineering-assumption] no-load magnetizing current %
  lines:
    # Standard LV aerial bundled / underground cable parameters (Aluminium XLPE conductor)
    r_ohm_per_km: 0.384             # [engineering-assumption] 95 mm2 Al cable resistance
    x_ohm_per_km: 0.082             # [engineering-assumption] reactance
    c_nf_per_km: 260.0              # [engineering-assumption] capacitance
    max_i_ka: 0.220                 # [engineering-assumption] thermal current rating ~220 A (158 kVA at 415V)
    segment_lengths_km:
      feeder_trunk_1: 0.12          # Bus_Main_LV to Bus_Residential_1
      feeder_trunk_2: 0.15          # Bus_Residential_1 to Bus_Residential_2
      feeder_trunk_3: 0.15          # Bus_Residential_2 to Bus_Residential_3
      feeder_commercial: 0.10       # Bus_Main_LV to Bus_Commercial
      feeder_critical: 0.08         # Bus_Main_LV to Bus_Critical
      feeder_ev: 0.10               # Bus_Residential_1 to Bus_EV_Hub
      feeder_bess: 0.05             # Bus_Main_LV to Bus_BESS

# -----------------------------------------------------------------------------
# Solar Intermittency Scenario (PV_CLOUD_EVENT_V1)
# -----------------------------------------------------------------------------
cloud_event:
  enabled: false                    # Set to true for PV_CLOUD_EVENT_V1 scenario
  start_time: "15:00"               # [engineering-assumption] afternoon cloud event start
  end_time: "16:00"                 # [engineering-assumption] 1-hour cloud cover event
  pv_factor: 0.30                   # [engineering-assumption] 70% solar irradiance drop (30% remaining)

# -----------------------------------------------------------------------------
# Statutory Voltage Limits (Configurable — Section 2)
# These define the operating envelope used by GridFlex coordination.
# They are NOT universal constants — adjust for local grid code.
# -----------------------------------------------------------------------------
voltage:
  min_pu: 0.95                        # [engineering-assumption] lower statutory voltage limit
  max_pu: 1.05                        # [engineering-assumption] upper statutory voltage limit

# -----------------------------------------------------------------------------
# Reverse Power Flow Configuration
# -----------------------------------------------------------------------------
reverse_flow:
  limit_kw: 100.0                     # [engineering-assumption] substation reverse export threshold
  normal_export_kw: 25.0              # [engineering-assumption] normal accepted export level

# -----------------------------------------------------------------------------
# Validation & Operating Thresholds
# -----------------------------------------------------------------------------
validation:
  min_voltage_pu: 0.94              # [engineering-assumption] undervoltage observation threshold (-6%)
  max_voltage_pu: 1.06              # [engineering-assumption] overvoltage observation threshold (+6%)
  transformer_warning_pct: 80.0     # [engineering-assumption] 80% loading warning
  transformer_critical_pct: 100.0   # [engineering-assumption] 100% rated capacity
  line_warning_pct: 80.0            # [engineering-assumption]
  line_critical_pct: 100.0          # [engineering-assumption]
  power_balance_tolerance_kw: 1.0   # [engineering-assumption] maximum numerical mismatch tolerance

# -----------------------------------------------------------------------------
# Phase 2: Flexibility & Participation Configuration
# -----------------------------------------------------------------------------
flexibility:
  default_participation_rate: 0.70  # [engineering-assumption] 70% of DER owners opt into flexibility programs
  sensitivity_rates: [1.00, 0.70, 0.40] # [engineering-assumption] 100%, 70%, 40% sensitivity testing

  pv:
    curtailment_allowed_default: true # [engineering-assumption] PV inverters technically support curtailment
    min_power_kw: 0.0
    response_time_minutes: 1         # [engineering-assumption] fast inverter response (~seconds, within 1 min)
    control_mode: "curtailment"

  battery:
    reserve_soc: 0.10                # [engineering-assumption] 10% emergency reserve margin above min_soc
    response_time_minutes: 1         # [engineering-assumption] fast 4-quadrant BESS response
    control_mode: "bidirectional"
    participating: true              # Community asset participates 100%

  ev:
    smart_charging_allowed_default: true # [engineering-assumption] EV wallbox supports dynamic throttle
    v2g_enabled: false               # [engineering-assumption] V2G is strictly disabled in Phase 2
    response_time_minutes: 5         # [engineering-assumption] EVSE signaling ramp
    control_mode: "unidirectional_throttle"
    departure_buffer_hours: 1.0      # Safety margin before scheduled departure

  flexible_loads:
    curtailment_allowed_default: true # [engineering-assumption]
    response_time_minutes: 15        # [engineering-assumption] thermal / relay switching interval
    control_mode: "discrete_shed_or_shift"

# -----------------------------------------------------------------------------
# Phase 5: Dynamic Operating Envelopes (DOE) Configuration
# -----------------------------------------------------------------------------
doe:
  hysteresis:
    transformer_activate_pct: 80.0     # [engineering-assumption] loading threshold to trigger envelope tightening
    transformer_release_pct: 75.0      # [engineering-assumption] loading threshold to release envelope restriction
    voltage_low_activate_pu: 0.950     # [engineering-assumption] lower voltage threshold to trigger envelope
    voltage_low_release_pu: 0.955      # [engineering-assumption] lower voltage recovery threshold
    voltage_high_activate_pu: 1.050    # [engineering-assumption] upper voltage threshold to trigger envelope
    voltage_high_release_pu: 1.045     # [engineering-assumption] upper voltage recovery threshold
  uncertainty_margin:
    enabled: true
    factor: 0.15                       # [engineering-assumption] fraction of 90% forecast interval used as margin
  ramp_rate:
    pv_max_ramp_kw_per_min: 5.0        # [engineering-assumption] standard inverter ramp capability
    bess_max_ramp_kw_per_min: 10.0     # [engineering-assumption] 4-quadrant BESS ramp rate

